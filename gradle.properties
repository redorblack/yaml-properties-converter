pluginGroup = dev.red.yaml2props
pluginName = yaml-properties-converter
pluginVersion = 1.0.0

# 目标平台：IntelliJ IDEA Community 2023.2（Ultimate 同样可装）。
# 插件只用平台核心 API（ToolWindow / IconLoader / Swing），不碰 Java PSI，故 sinceBuild 可压到 232。
platformType = IC
platformVersion = 2023.2

# verifyPlugin 额外对着「本机真正在用的那个 IDE」再校验一遍二进制兼容性 ——
# 编译沙箱停在 platformVersion，装插件的 IDE 往往新好几个大版本，两边行为并不等价。
# 开源默认留空（避免硬编码本机路径）；本地想跑 verifyPlugin 时用 -PverifyAgainstLocalIde=... 临时传。
verifyAgainstLocalIde =

# 插件不打包自己的 kotlin-stdlib，由 IntelliJ 平台提供
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching = true
org.gradle.configuration-cache = false
