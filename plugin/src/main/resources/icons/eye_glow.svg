<svg width="13" height="13" viewBox="0 0 13 13" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ef" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#FF3333" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF0000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 刀盾狗 · 发光态（红眼） -->
  <!-- 菜刀（提亮） -->
  <rect x="0.8" y="2.0" width="0.7" height="2.8" rx="0.2" fill="#A08860"/>
  <path d="M0.5 1.0 L2.2 0.6 L2.5 2.0 L0.5 2.2 Z" fill="#D0D8E0" stroke="#A0A8B0" stroke-width="0.25"/>
  <!-- 盾牌 -->
  <path d="M10.2 3.5 L12.4 3.5 L12.5 6.5 L11.3 8.5 L10.1 6.5 Z"
        fill="#7B6B4A" stroke="#9B8B6A" stroke-width="0.35" stroke-linejoin="round"/>
  <circle cx="11.3" cy="5.5" r="0.6" fill="#D0B070" opacity="0.8"/>
  <!-- 球形身体 -->
  <ellipse cx="6.2" cy="7.2" rx="4.0" ry="3.8" fill="#D4A040"/>
  <!-- 肚皮/脸 -->
  <ellipse cx="6.2" cy="8.2" rx="3.0" ry="2.6" fill="#E8C470"/>
  <!-- 小耳朵 -->
  <path d="M3.4 4.2 L2.8 2.6 L4.4 3.8 Z" fill="#C09030"/>
  <path d="M9.0 4.2 L9.6 2.6 L8.0 3.8 Z" fill="#C09030"/>
  <!-- 左眼红光晕 -->
  <circle cx="4.4" cy="6.8" r="1.5" fill="url(#ef)"/>
  <!-- 右眼红光晕 -->
  <circle cx="8.0" cy="6.8" r="1.5" fill="url(#ef)"/>
  <!-- 眯眯眼（红光版） -->
  <path d="M3.8 6.4 L5.0 6.8 L3.8 7.2" fill="none" stroke="#DD0000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8.6 6.4 L7.4 6.8 L8.6 7.2" fill="none" stroke="#DD0000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 眼缝里透出的红光点 -->
  <ellipse cx="4.4" cy="6.8" rx="0.35" ry="0.2" fill="#FF4444"/>
  <ellipse cx="8.0" cy="6.8" rx="0.35" ry="0.2" fill="#FF4444"/>
  <!-- 鼻子 -->
  <ellipse cx="6.2" cy="8.0" rx="0.45" ry="0.3" fill="#2A2A2A"/>
  <!-- 坏笑（更咧） -->
  <path d="M4.8 8.8 Q6.2 9.5 7.6 8.5" fill="none" stroke="#2A2A2A" stroke-width="0.4" stroke-linecap="round"/>
  <!-- 小短手 -->
  <ellipse cx="2.8" cy="7.5" rx="0.7" ry="0.5" fill="#D4A040" transform="rotate(-20 2.8 7.5)"/>
  <ellipse cx="9.6" cy="7.5" rx="0.7" ry="0.5" fill="#D4A040" transform="rotate(20 9.6 7.5)"/>
</svg>
